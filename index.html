<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 448px;
            width: 100%;
            background: #ffffff;
            padding: 48px 40px 36px;
            border-radius: 8px;
            border: 1px solid #dadce0;
        }

        /* Логотип */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 22px;
            color: #1f1f1f;
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        /* Заголовок Sign in */
        .title {
            font-size: 24px;
            color: #202124;
            font-weight: 400;
            line-height: 1.333;
            margin-bottom: 8px;
        }

        /* Подзаголовок */
        .subtitle {
            font-size: 16px;
            color: #3c4043;
            line-height: 1.5;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Поле Email or phone */
        .input-field {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            font-size: 16px;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            color: #202124;
            background: #ffffff;
            margin-bottom: 4px;
        }

        .input-field:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 0 15px;
        }

        .input-field::placeholder {
            color: #5f6368;
            font-weight: 400;
        }

        /* Forgot email? */
        .forgot-link {
            display: inline-block;
            font-size: 14px;
            font-weight: 500;
            color: #1a73e8;
            text-decoration: none;
            margin: 8px 0 24px 0;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Guest секция */
        .guest-section {
            display: flex;
            gap: 14px;
            margin-bottom: 32px;
            align-items: flex-start;
        }

        .guest-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #1a73e8;
            flex-shrink: 0;
            cursor: default;
        }

        .guest-text {
            font-size: 14px;
            color: #3c4043;
            line-height: 1.5;
        }

        .guest-text .learn-more {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .guest-text .learn-more:hover {
            text-decoration: underline;
        }

        /* Кнопки внизу */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .create-btn {
            font-size: 14px;
            font-weight: 500;
            color: #1a73e8;
            background: none;
            border: none;
            padding: 8px 4px;
            cursor: default;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
        }

        .next-btn {
            background: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            cursor: default;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Язык */
        .lang-selector {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid #dadce0;
            font-size: 14px;
            color: #3c4043;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .lang-selector .arrow {
            font-size: 11px;
            color: #5f6368;
            margin-left: 2px;
        }

        /* ===== НИЖНИЕ ССЫЛКИ: Help · Privacy · Terms ===== */
        .footer-links {
            margin-top: 16px;
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #3c4043;
        }

        .footer-links a {
            color: #3c4043;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 24px;
            }
            .actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Логотип -->
    <div class="logo">
        <svg viewBox="0 0 24 24" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0z" fill="#4285F4"/>
            <path d="M12 3.6c-4.645 0-8.4 3.755-8.4 8.4 0 4.645 3.755 8.4 8.4 8.4 4.645 0 8.4-3.755 8.4-8.4 0-4.645-3.755-8.4-8.4-8.4zm0 14.4c-3.314 0-6-2.686-6-6s2.686-6 6-6 6 2.686 6 6-2.686 6-6 6z" fill="#FFFFFF"/>
            <path d="M17.4 12c0 2.982-2.418 5.4-5.4 5.4S6.6 14.982 6.6 12 9.018 6.6 12 6.6s5.4 2.418 5.4 5.4z" fill="#34A853"/>
            <path d="M12 7.2v4.8l3.6 2.4-1.2-3.6 3.6-1.2-3.6-2.4 1.2-3.6z" fill="#FBBC05"/>
            <path d="M12 16.8V12l-3.6-2.4 1.2 3.6-3.6 1.2 3.6 2.4-1.2 3.6z" fill="#EA4335"/>
        </svg>
        <span class="logo-text">Gmail</span>
    </div>

    <!-- Sign in -->
    <div class="title">Sign in</div>

    <!-- Поле Email or phone -->
    <input class="input-field" type="text" placeholder="Email or phone">

    <!-- Подзаголовок (под полем) -->
    <div class="subtitle">
        with your Google Account to continue to Gmail. This account<br>
        will be available to other Google apps in the browser.
    </div>

    <!-- Forgot email? -->
    <a href="#" class="forgot-link">Forgot email?</a>

    <!-- Guest mode -->
    <div class="guest-section">
        <input class="guest-checkbox" type="checkbox" checked>
        <div class="guest-text">
            Not your computer? Use Guest mode to sign in privately. <a href="#" class="learn-more">Learn more</a><br>
            about using Guest mode
        </div>
    </div>

    <!-- Create account + Next -->
    <div class="actions">
        <span class="create-btn">Create account</span>
        <button class="next-btn">Next</button>
    </div>

    <!-- English (United States) -->
    <div class="lang-selector">
        <span>English (United States)</span>
        <span class="arrow">▼</span>
    </div>

    <!-- Help · Privacy · Terms -->
    <div class="footer-links">
        <a href="#">Help</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>

</div>

</body>
</html>
